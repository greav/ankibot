name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

# The pipeline ends at "image published": the server pulls it on its own (see
# docs/deploy.md), so no credentials for the server exist here at all.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The token is only needed for the clone itself; don't leave it in .git/config
          # where any later step in the job could read it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make compile_proto
      - run: uv run mypy ankibot tests
      - run: uv run codespell ankibot
      - run: uv run lint-imports
      - run: uv run pytest

  build:
    needs: checks
    # workflow_dispatch can be started from any branch; only master may become :latest.
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # The image installs from requirements.txt with --no-deps, so regenerate it from the
      # lockfile here instead of trusting the committed copy to be in sync.
      - run: make export_requirements
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # One manifest per build. The default provenance attestation turns the push into
          # an image index whose children show up in ghcr as separate untagged versions,
          # and the retention job below would count (and could delete) them.
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Private ghcr storage is capped (500 MB on the Free plan) and SHA tags never expire on
  # their own. Every build is one version, so "keep the newest N" is exactly "keep the last
  # N master commits": the one just built is the newest and :latest points at it.
  retain:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ankibot
          package-type: container
          min-versions-to-keep: 10
