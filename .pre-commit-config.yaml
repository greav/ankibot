repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.12
    hooks:
      - id: uv-export
        args:
          [
            "--frozen",
            "--no-dev",
            "--no-hashes",
            "--output-file=requirements.txt",
          ]
  - repo: local
    hooks:
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        types: [text]
  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        exclude: ^\.claude/
        additional_dependencies:
          - mdformat-gfm # GitHub-flavored Markdown (tables, etc.)
          - mdformat-frontmatter # keep YAML frontmatter intact instead of eating it
  - repo: local
    hooks:
      - id: ruff-check-imports
        name: ruff check (sort imports)
        entry: uv run ruff check --force-exclude --select I --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        # Contracts are about the whole import graph, not the changed files — and the graph can
        # be changed by editing `.importlinter` alone, which no file type would match.
        pass_filenames: false
        always_run: true
