logger:
  level: INFO
  fmt: "%(asctime)s - %(request_id)s - %(name)s - %(levelname)s - %(message)s"

bot:
  token: ${oc.env:BOT_TOKEN}

anki_web:
  username: ${oc.env:ANKI_USERNAME}
  password: ${oc.env:ANKI_PASSWORD}
  ankiweb_base_url: https://ankiweb.net
  ankiuser_base_url: https://ankiuser.net

anki_card_gateway:
  # Reuses anki_web's ankiuser_base_url so the two cannot drift apart.
  ankiuser_base_url: ${anki_web.ankiuser_base_url}
