logger:
  level: INFO
  fmt: "%(asctime)s - %(request_id)s - %(name)s - %(levelname)s - %(message)s"

bot:
  token: ${oc.env:BOT_TOKEN}

access:
  # Comma-separated Telegram user ids allowed to use the bot; everyone else is silently ignored.
  allowed_user_ids: ${oc.env:ALLOWED_USER_IDS}

anki_web:
  username: ${oc.env:ANKI_USERNAME}
  password: ${oc.env:ANKI_PASSWORD}
  ankiweb_base_url: https://ankiweb.net
  ankiuser_base_url: https://ankiuser.net

anki_svc:
  # Every /svc gateway (cards, decks) shares this one client.
  # Reuses anki_web's ankiuser_base_url so the two cannot drift apart.
  ankiuser_base_url: ${anki_web.ankiuser_base_url}

anki_vocabulary_cards:
  # Where generated word cards go. The notetype's field names are read from AnkiWeb at
  # runtime, so editing the notetype in Anki needs no change here.
  deck_name: "English Words V2"
  notetype_name: "English Words Context" # the NOTETYPE's name; not always the deck's

user_preferences:
  # Where each user's /decks and /model choices are kept between restarts. Relative to the working
  # directory: data/ in the repo locally, /opt/data in the container (see deploy/compose.yaml).
  path: data/user_preferences.json

model_catalog:
  # What /model offers. Every entry must support json_schema structured outputs AND image input:
  # one choice serves vocabulary cards, screenshot word suggestions and snippet cards alike.
  # `make list_models` shows which ids the configured key can call.
  #
  # reasoning_effort: a card is a few hundred tokens, and a model that reasons by default answers
  # it slower and dearer for no better card, so every reasoning model is pinned to `none`. Leave
  # it out for a model that takes no such setting (the GPT-4.1 family rejects the parameter).
  default: gpt-5.6-terra
  models:
    - id: gpt-5.6-sol
      provider: openai
      label: "GPT-5.6 Sol"
      reasoning_effort: none
    - id: gpt-5.6-terra
      provider: openai
      label: "GPT-5.6 Terra"
      reasoning_effort: none
    - id: gpt-5.6-luna
      provider: openai
      label: "GPT-5.6 Luna"
      reasoning_effort: none
    - id: gpt-5.4-mini
      provider: openai
      label: "GPT-5.4 mini"
      reasoning_effort: none
    - id: gpt-4.1
      provider: openai
      label: "GPT-4.1"
    - id: gpt-4.1-mini
      provider: openai
      label: "GPT-4.1 mini"

openai_client:
  api_key: ${oc.env:OPENAI_API_KEY}
  base_url: https://api.openai.com/v1
  timeout_seconds: 30.0
  max_retries: 2

openai_word_suggester:
  # Upper bound on the words offered to pick from one screenshot; the model may return fewer.
  max_candidates: 6

openai_snippet_cards:
  # Upper bound on cards distilled from one snippet; the model may return fewer.
  max_cards: 8
