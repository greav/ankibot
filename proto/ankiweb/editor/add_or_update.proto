syntax = "proto3";

package ankiweb.svc;

// POST /svc/editor/add-or-update
message AddOrUpdateRequest {
  message AddMode {
    int64 notetype_id = 1;
    int64 deck_id     = 2;
  }
  message EditMode {
    int64 note_id = 1;
  }
  repeated string fields = 1;
  string          tags   = 2;
  oneof mode {
    AddMode  add  = 3;
    EditMode edit = 4;
  }
}
message AddOrUpdateResponse {}
