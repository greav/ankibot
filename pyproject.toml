[project]
name = "ankibot"
version = "0.1.0"
description = "Telegram bot for creating ankig cards"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic",
    "omegaconf",
    "aiogram>=3.22.0",
    "httpx",
    "protobuf",
    "openai>=3.6.0",
    "dishka>=1.10.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "codespell",
    "vulture",
    "pytest-asyncio>=1.4.0",
    "grpcio-tools",
    "types-protobuf>=7.34.1.20260518",
    "httpx2>=2.12.0",
    "import-linter>=2.14",
]

[tool.mypy]
namespace_packages = true
disallow_incomplete_defs = true
strict_equality = true
no_implicit_optional = true
show_error_context = true
pretty = true
install_types = true
non_interactive = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
explicit_package_bases = true

# Requires @override on every method that overrides a base — without it, renaming a port
# method leaves adapters and test doubles silently stale.
enable_error_code = ["explicit-override"]

[tool.vulture]
min_confidence = 60
paths = ["ankibot"]
sort_by_size = true
verbose = false

[tool.ruff]
line-length = 119
extend-exclude = ["ankiweb"]

[tool.ruff.lint]
select = [
  "F", # Pyflakes
  "E", "W", # pycodestyle errors and warnings
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "C4", # flake8-comprehensions
  "ERA", # eradicate
  "T20", # flake8-print
  "Q", # flake8-quotes
  "RSE", # flake8-raise
  "SIM", # flake8-simplify
  "ARG", # flake8-unused-arguments
  "N", # pep8-naming
  "I", # isort
  "TID", # flake8-tidy-imports
]

ignore = [
    "B008",  # Do not perform function calls in argument defaults
    "SIM108" # if-else-block-instead-of-if-exp
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Staged for the move to `select = ["ALL"]`; inert until those rule sets are selected.
"tests/*" = ["S101", "S105", "S106", "S311", "PLR0913", "PLR2004"]
# Operator-facing CLI scripts report progress on stdout.
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.codespell]
skip = "./venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]

[tool.uv]
package = false

[tool.uv.pip]
emit-index-url = true
output-file = "requirements.txt"
annotation-style = "line"
